# MeePick 정적 서빙 (Synology Docker의 nginx 컨테이너용)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # expo 정적 내보내기는 라우트별 html을 만든다 (/history → history.html).
    # 태블릿에서 /history 주소로 바로 들어와도 열리게 매핑한다.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 해시 붙은 번들은 영구 캐시 — 재배포하면 파일명이 바뀌므로 안전하다
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA 매니페스트·아이콘은 짧게 캐시
    location ~* \.(json|png)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
