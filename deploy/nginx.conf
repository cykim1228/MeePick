# MeePick 정적 서빙 (Synology Docker의 nginx 컨테이너용)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # expo 정적 내보내기는 라우트별 html을 만든다 (/history → history.html).
    # 태블릿에서 /history 주소로 바로 들어와도 열리게 매핑한다.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 해시 붙은 번들은 영구 캐시 — 재배포하면 파일명이 바뀌므로 안전하다
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 서비스 워커는 절대 캐시하지 않는다. 캐시되면 새 버전을 영영 못 받아
    # 앱이 옛 화면에 갇힌다 — 오프라인 셸의 유일한 위험이 이것이다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── 모임 사진 ──────────────────────────────────────────────────────────
    # 업로드만 미디어 서버로 넘긴다. 더 긴 접두사가 이겨서 /media/ 규칙보다 먼저 잡힌다.
    location /media/upload {
        # 도커 내장 DNS로 '요청할 때' 이름을 푼다.
        # proxy_pass에 이름을 그대로 쓰면 nginx가 **시작할 때** 한 번만 해석하는데,
        # 그때 미디어 컨테이너가 안 떠 있으면 nginx 자체가 못 뜬다 —
        # 사진 서버 하나 때문에 앱 전체가 내려가는 구성은 곤란하다.
        # 변수로 두면 못 찾을 때 그 요청만 502가 된다.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $media_host meepick-media;
        proxy_pass http://$media_host:8080/upload;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 12m;
        # 12MB를 통째로 버퍼에 담았다가 넘기면 메모리가 아깝다. 흘려보낸다.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # 읽기는 nginx가 NAS 폴더에서 직접 준다. 파일명이 uuid라 내용이 바뀌지 않으므로
    # 영구 캐시가 안전하다.
    location /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 사진 폴더 구경거리를 만들지 않는다.
        autoindex off;
        # try_files를 쓰지 않는다 — alias와 함께 쓰면 경로 계산이 어긋나는 오래된 함정이다.
        # 그냥 두면 파일이 없을 때 알아서 404가 난다.
    }

    # PWA 매니페스트·아이콘은 짧게 캐시
    location ~* \.(json|png)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
