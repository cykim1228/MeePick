# MeePick 웹 서빙 — PC에서 빌드한 dist를 NAS로 복사해 쓰는 구성.
#
# 이 파일과 같은 폴더에 nginx.conf, dist/, media-server.mjs, .env 가 함께 있어야 한다.
# (deploy/publish-nas.ps1 이 한꺼번에 밀어 넣는다)
#
# 입구는 두 개다:
#   https://<DDNS도메인>:8088  ← DSM 역방향 프록시(인증서 담당)가 8089로 넘긴다. 평소 쓰는 문.
#   http://<NAS IP>:8089       ← 컨테이너 직결. 프록시 문제 때 비상용.
# 8088·8089를 라우터에서 포워딩하지 말 것 — MeePick은 LAN 전용이다.
#
# MEDIA_DIR 은 같은 폴더의 .env 에서 온다. NAS의 Photo/Server 공유 폴더 실제 경로여야 한다.
# 확인: ls -d /volume*/photo/Server
services:
  meepick-web:
    image: nginx:alpine
    container_name: meepick-web
    ports:
      - "8089:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 사진은 읽기 전용으로만 붙인다 — 쓰기는 아래 미디어 서버 몫이다.
      - ${MEDIA_DIR:?MEDIA_DIR 이 .env 에 없습니다}:/srv/media:ro
    depends_on:
      - meepick-media
    restart: unless-stopped

  # 사진 업로드 전용. 의존성이 없어서 이미지를 굽지 않고 파일 한 장만 얹는다.
  meepick-media:
    image: node:22-alpine
    container_name: meepick-media
    command: node /app/media-server.mjs
    working_dir: /app
    volumes:
      - ./media-server.mjs:/app/media-server.mjs:ro
      - ${MEDIA_DIR:?MEDIA_DIR 이 .env 에 없습니다}:/data
    env_file:
      - ./.env
    restart: unless-stopped
