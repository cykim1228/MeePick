# MeePick 웹 서빙 — PC에서 빌드한 dist를 NAS로 복사해 쓰는 구성.
#
# 이 파일과 같은 폴더에 nginx.conf, dist/ 가 함께 있어야 한다.
# (deploy/publish-nas.ps1 이 세 개를 한꺼번에 밀어 넣는다)
#
# Synology Container Manager → 프로젝트 → 생성 → 이 폴더 선택.
services:
  meepick-web:
    image: nginx:alpine
    container_name: meepick-web
    ports:
      - "8088:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
